<style>

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px;text-align:center}
h1{font-size:22px;margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:6px}
.xp{background:var(--card);padding:6px 12px;border-radius:20px;white-space:nowrap}
.path{display:flex;flex-direction:column;gap:14px;margin:18px 0}
.lv{width:84px;height:84px;border-radius:50%;border:0;background:var(--g);box-shadow:0 6px 0 var(--gd);color:#fff;font-size:34px;cursor:pointer}
.lv small{display:block;font-size:10px;font-weight:700}

.row:nth-child(4n+1){transform:translateX(-50px)}.row:nth-child(4n+3){transform:translateX(50px)}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:19px;line-height:1.35;text-align:left}
.big{font-size:80px;margin:10px 0}

.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;font-size:min(8vw,34px);cursor:pointer}
.c.l{background:var(--lt)}.c.d{background:var(--dk)}
.c.h::after{content:"";position:absolute;width:34%;height:34%;border-radius:50%;background:var(--hint)}
.c.h.t::after{width:86%;height:86%;background:none;border:4px solid var(--hint)}
.c.hn{animation:pl .7s infinite alternate;outline:4px solid #ffc800;outline-offset:-4px}
@keyframes pl{to{filter:brightness(1.4)}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.me{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000;z-index:1;font-size:min(9vw,38px);animation:pop .3s}
.en{color:#222;text-shadow:0 0 2px #fff;z-index:1}
.btn{border:0;border-radius:14px;padding:13px 18px;font-size:17px;font-weight:700;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);margin:5px;cursor:pointer}
.btn.s{background:#8a947c;box-shadow:0 4px 0 #66705a}.btn.y{background:#ffb300;box-shadow:0 4px 0 #cc8f00}
#msg{min-height:28px;font-weight:700;font-size:18px;color:#d8453a}
#win{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9;overflow:hidden}
#win .bx{background:var(--card);border-radius:20px;padding:26px;width:min(86vw,340px)}
.cf{position:absolute;top:-40px;font-size:28px;animation:fl 2.5s linear forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}

.hero{font-size:24px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff9600,#ff4b8b,#ce82ff);border-radius:20px;padding:18px 12px;margin:10px 0;text-shadow:0 2px 0 #0003}
.menu{display:flex;gap:12px;margin:12px 0}
.mc{flex:1;border:0;border-radius:20px;color:#fff;font-size:42px;padding:16px 6px;box-shadow:0 6px 0 #0003;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mc b{font-size:18px}.mc small{font-size:13px;opacity:.9}
.rc{display:flex;gap:12px;background:var(--card);border:3px solid;border-radius:18px;padding:12px;margin:12px 0;text-align:left;font-size:17px;align-items:center}
.re{min-width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
h2{margin:8px 0}.card{border-left:6px solid #ff9600}
.btn{font-size:20px;padding:16px 22px}.lv{width:92px;height:92px}.mc{font-size:34px;padding:14px 4px}.mc b{font-size:15px}.xp{font-size:17px}
.alb{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.st{background:var(--card);border-radius:18px;font-size:54px;padding:14px;box-shadow:0 4px 0 #0002}.st.no{opacity:.35}
.zone{border-radius:22px;padding:12px;color:#fff;box-shadow:0 6px 0 #0003}
.zt{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-shadow:0 2px 0 #0003}.zt small{font-size:14px;background:#fff3;padding:4px 8px;border-radius:12px}
.zr{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tk{width:62px;height:62px;border-radius:50%;border:0;background:#fff;color:#333;font-size:30px;box-shadow:0 4px 0 #0003;cursor:pointer}
.tk.lock{opacity:.5}.tk.cur{animation:pl .7s infinite alternate;outline:4px solid #ffc800}
.dots{font-size:18px;margin:6px 0;letter-spacing:6px}.st small{display:block;font-size:12px}
.room{background:var(--card);border-radius:20px;padding:14px;font-size:54px;margin:10px 0}.room small{display:block;font-size:15px}
.stk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px}.stk .no{opacity:.3}#wb{animation:pop .6s}
</style>
</head>

{n:'Конь',p:'n',s:[7,1],en:[[5,2],[3,3],[1,4],[0,6]],t:'Прогони всех чёрных пешек конём!'},

{n:'Пешка бьёт',p:'p',s:[6,2],en:[[5,3],[4,4],[3,3]],t:'Бей по диагонали, всех чёрных пешек!'},
{z:1,n:'Мат ладьёй',p:'r',s:[7,0],o:[['k',2,6,0],['k',0,7,1]],g:[[0,0]],b:[],c:'🐱 Воришка',sy:'Хитрый кот-воришка хочет убежать! Если на короля напали и ему некуда уйти — это шах и мат. Поставь ладью так, чтобы кот не убежал!',t:'Поставь мат ладьёй. Коту должно быть некуда бежать.'},
{z:1,n:'Мат ферзём',p:'q',s:[3,4],o:[['k',2,6,0],['k',0,7,1]],g:[[0,4],[0,1],[1,6]],b:[],t:'Поставь мат ферзём! Найди ход, после которого кот пойман.'},
{z:1,n:'Пат',p:'q',s:[2,4],o:[['k',1,5,0],['k',0,7,1]],g:[[2,7],[5,7]],b:[[2,6]],sy:'Осторожно! Если коту некуда идти, но на него никто не нападает, это пат — ничья. Нам нужен мат, а не ничья!',t:'Не ставь пат! Найди ход, чтобы кот был пойман.'}

let st={done:0,xp:0,streak:0,last:'',voice:1,lim:1,td:'',cnt:0,cups:0,pend:0,rw:[],dn:[]},cur=0,pos,S,E,W,O,mv,lv,hl=[],hs='',mg='',lock=false,AC;

const yd=()=>{const d=new Date();d.setDate(d.getDate()-1);return ds(d)};

if(st.last!=ds(new Date())&&st.last!=yd())st.streak=0;
if(!st.dn.length&&st.done)st.dn=[...Array(st.done).keys()];
const K=(a,b)=>a+','+b,$=id=>document.getElementById(id);

function snd(t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const q={m:[[520,.08]],c:[[660,.08],[880,.12]],win:[[523,.12],[659,.12],[784,.12],[1047,.3]],bad:[[250,.3]]}[t];let a=AC.currentTime;for(const[f,d]of q){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.2,a);g.gain.exponentialRampToValueAtTime(.001,a+d);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+d);a+=d}}catch(e){}}

function vo(){try{return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang)).sort((a,b)=>/milena|katya|irina|svetlana|alena|tatyana|google/i.test(b.name)-/milena|katya|irina|svetlana|alena|tatyana|google/i.test(a.name))}catch(e){return[]}}

const CL={r:'#1cb0f6',b:'#ce82ff',q:'#ff9600',n:'#ff4b4b',k:'#58cc02',p:'#ff86d0',z:'#00cdb0'};
const pl=n=>n%10==1&&n%100!=11?'задание':n%10>1&&n%10<5&&(n%100<10||n%100>19)?'задания':'заданий';

function home(){
const td=st.td==ds(new Date())?st.cnt:0;

const nx=L.findIndex((t,i)=>!st.dn.includes(i));
Z.forEach((z,zi)=>{const lk=0,dn=z.t.filter((t,j)=>st.dn.includes(z.a+j)).length;
h+=(zi?'<div class="dots">🐾🐾🐾</div>':'')+'<div class="zone" style="background:'+z.c+(lk?';filter:grayscale(.7)':'')+'"><div class="zt"><span>'+z.e+' '+z.n+(dn==z.t.length?' 🏅':'')+'</span><small>'+dn+'/'+z.t.length+' ⭐</small></div><div class="zr">';
z.t.forEach((t,j)=>{const i=z.a+j,l=0;h+='<button class="tk'+(i==nx?' cur':'')+(l?' lock':'')+'" '+(l?'':'onclick="open_('+i+')"')+'>'+(st.dn.includes(i)?'✓':ico(t))+'</button>'});
h+='</div></div>'});
$('app').innerHTML=h;
}

function start(){ms=0;auto(lv.t);
pos=lv.s.slice();S=new Set((lv.st||[]).map(x=>K(...x)));E=new Set((lv.en||[]).map(x=>K(...x)));W=new Set((lv.w||[]).map(x=>K(...x)));

IT={};(lv.it||[]).forEach(x=>IT[K(x[0],x[1])]=x[2]);mv=0;hs='';mg='';lock=false;draw();
}
function legal(f){
const o=[],[r,c]=f,p=lv.p,ok=(a,b)=>a>=0&&a<8&&b>=0&&b<8&&!W.has(K(a,b));

function draw(){
hl=lock||lv.ch||lv.f?[]:legal(pos);const hh=new Set();let b='';

L0[15].goal=L0[16].goal=L0[17].goal='mate';
